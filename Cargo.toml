[package]
name = "omm"
version = "0.1.0"
edition = "2024"

[lib]
name = "omm"
path = "src/lib.rs"

[[bin]]
name = "omm"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
image = "0.25.10"
mpd = "0.1.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "test-util"] }
toml = "1.1.8"

[profile.release]
lto = "thin"
